version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: south-america-backend
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot-reload
      - ./server:/app
      - /app/node_modules  # Prevent overwriting node_modules
      # Mount database directory
      - ./database:/app/database
    environment:
      - NODE_ENV=development
      - PORT=3000
    networks:
      - app-network
    command: npm run dev

  # Frontend React App
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: south-america-frontend
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot-reload
      - ./client:/app
      - /app/node_modules  # Prevent overwriting node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    networks:
      - app-network
    depends_on:
      - backend
    command: npm run dev -- --host

networks:
  app-network:
    driver: bridge
